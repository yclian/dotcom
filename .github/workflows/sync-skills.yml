name: Sync Skills Catalog

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [skills-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dotcom
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout skills repo with full history
        uses: actions/checkout@v4
        with:
          repository: yclian/skills
          path: skills-source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Synchronize skills catalog
        env:
          SKILLS_DIR: ${{ github.workspace }}/skills-source
        run: node scripts/sync-skills.mjs

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add content/skills
          if git diff --staged --quiet; then
            echo "No changes detected in skills catalog."
          else
            git commit -m "chore(skills): sync skills catalog from yclian/skills"
            git push origin master
          fi
